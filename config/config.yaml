# Folktale Classifier Configuration

# Data paths
data:
  western_tales_path: "data/western/aft.csv"
  asian_tales_dir: "../"  # Parent directory (Downloads folder) where JSON files are located
  processed_dir: "data/processed/"
  embeddings_cache: "data/processed/embeddings/"

# Model configurations
model:
  # Sentence transformer for vectorization
  sentence_transformer: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  
  # LinearSVC hyperparameter (C=5 optimal per 5-fold CV on 14-class grouping)
  C: 5.0
  max_iter: 10000
  # (regularization and solver fields kept for backward compat; not used by LinearSVC)
  regularization: "l2"
  solver: "lbfgs"

  # Feature configuration
  # use_tfidf=true: Word TF-IDF (1-3gram, 50k) + Char TF-IDF (3-5gram, 30k)
  # + L2-normed sentence embeddings. Combined CV accuracy on 14 ATU classes: ~71%.
  # Mahalanobis OOD detection always uses the pure 384-dim embedding space.
  use_tfidf: true

  # ATU grouping: '14class' (scholarly subdivisions) or '7class' (broad majors)
  atu_grouping: "14class"
  
  # Random seed for reproducibility
  random_state: 42

# Clustering configuration
clustering:
  # TopK SAE (EleutherAI architecture) — primary method
  sae:
    n_features: 1536       # expansion factor 4 × 384
    k: 16                  # active features per tale
    n_epochs: 150
    lr: 0.0002
    auxk_alpha: 0.03125    # 1/32, weight for dead-feature revival loss
    batch_size: 256

  # SAE-Lens parameters (legacy stub — not actively used)
  sae_lens:
    enable: false
    sparsity_penalty: 0.1
    learning_rate: 0.0001

  # K-means alternative
  kmeans:
    enable: true
    n_clusters: 20
    n_init: 10

  # Gemmascope alternative
  gemmascope:
    enable: false
    n_components: 20

# Auto-interpretability (EleutherAI delphi methodology)
auto_interp:
  # Anthropic model used for explanation generation and scoring
  model: "claude-haiku-4-5-20251001"
  # Number of top SAE features to auto-explain
  n_features_to_explain: 50
  # Exemplars shown to LLM per feature
  n_pos_exemplars: 7        # high-activation tales
  n_neg_exemplars: 5        # zero-activation tales
  n_score_pos: 5            # held-out positives for scoring
  n_score_neg: 5            # held-out negatives for scoring
  excerpt_len: 400          # character length of each excerpt
  rate_limit_delay: 0.5     # seconds between API calls

# Interpretability
interpretability:
  # Top tokens per feature
  top_tokens_k: 10
  
  # Top input features per cluster
  top_features_k: 20
  
  # N-gram analysis
  ngram_range: [1, 3]
  top_ngrams_k: 15
  
  # Representative stories per cluster
  n_representative_stories: 5

# Training configuration
training:
  test_size: 0.2
  validation_size: 0.1
  batch_size: 32
  epochs: 50
  early_stopping_patience: 5

# Evaluation
evaluation:
  # Metrics for confidence analysis
  compute_entropy: true
  compute_confidence: true
  
  # Visualization
  plot_confidence_distribution: true
  plot_entropy_distribution: true

# Paths for output
output:
  models_dir: "results/models/"
  embeddings_dir: "results/embeddings/"
  clusters_dir: "results/clusters/"
  plots_dir: "results/plots/"
  analysis_dir: "results/analysis/"

# Logging
logging:
  level: "INFO"
  file: "logs/folktale_classifier.log"
